[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Sbdock"
version = "0.1.0"
description = "High speed docking / virtual screening using Sbatch"
authors = [
    {name = "Ragavishagan Rajasekar", email = "rvfhc@missouri.edu"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rdkit>=2024.03.5",
    "pandas>=2.2.3"
]

[project.urls]
"Homepage" = "https://github.com/MU-BLSC/SlurmBatch-VinaDock"